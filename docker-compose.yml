services:
  # 1. Painel Principal de Monitoramento (JM Cyber Protect SOC War Room)
  painel-cyber:
    build: .
    container_name: jm_cyber_protect_dashboard
    restart: always
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 2
    expose:
      - "8000"
    ports:
      # Amarrado estritamente a 127.0.0.1 para evitar exposição direta de portas na VPS
      - "127.0.0.1:8000:8000"
    volumes:
      - ./auth.db:/app/auth.db
      - ./.env:/app/.env:ro
      - ./static:/app/static:ro
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    networks:
      - soc_internal_net

  # 2. Console Administrativo Externo Isolado (Gestão de Utilizadores)
  admin-console:
    build: .
    container_name: jm_cyber_protect_admin
    restart: always
    command: uvicorn admin_server:app --host 0.0.0.0 --port 8001 --workers 1
    expose:
      - "8001"
    ports:
      # Apenas localhost (acessível via túnel SSH ou proxy autenticado com chave mestra)
      - "127.0.0.1:8001:8001"
    volumes:
      - ./auth.db:/app/auth.db
      - ./.env:/app/.env:ro
      - ./static:/app/static:ro
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    networks:
      - soc_internal_net

networks:
  soc_internal_net:
    driver: bridge

