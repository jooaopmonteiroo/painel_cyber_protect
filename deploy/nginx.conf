# ====================================================================
# Configuração Nginx de Produção para o JM Cyber Protect & UniFi Hub
# Domínio Principal: monitor.jmcyberprotect.tech (ou jmcyberprotect.tech)
# Subdomínio Admin: admin.jmcyberprotect.tech
# Caminho na VPS: /etc/nginx/sites-available/jmcyberprotect.tech
# ====================================================================

# 1. Zonas de Rate Limiting para Proteção Corporativa contra Abusos
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# 2. Configurações de Otimização e Compressão Gzip
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# ====================================================================
# SERVIDOR 1: REDIRECIONAMENTO HTTP PARA HTTPS (PORTA 80)
# ====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name monitor.jmcyberprotect.tech jmcyberprotect.tech www.jmcyberprotect.tech admin.jmcyberprotect.tech;

    # Permitir validação do Certbot (ACME Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirecionamento permanente para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ====================================================================
# SERVIDOR 2: PAINEL PRINCIPAL & API PROXY (HTTPS PORTA 443)
# ====================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.jmcyberprotect.tech jmcyberprotect.tech www.jmcyberprotect.tech;

    # Certificados SSL Let's Encrypt (gerados via Certbot)
    ssl_certificate /etc/letsencrypt/live/monitor.jmcyberprotect.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.jmcyberprotect.tech/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/monitor.jmcyberprotect.tech/chain.pem;

    # Parâmetros Criptográficos Modernos e Seguros (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Cabeçalhos de Segurança Estritos (Hardening HSTS & Anti-Clickjacking)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Tamanho Máximo de Upload
    client_max_body_size 25M;

    # 1. Rota de Login com Proteção Estrita contra Força Bruta
    location /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2.1 Rota SSE em Tempo Real (Buffer desativado para streaming de baixa latência)
    location = /api/unifi/realtime-stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Proxy para APIs (Rate Limiting de 30 req/s)
    location /api/ {
        limit_req zone=api_general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 3. Proxy Principal com Suporte a WebSockets / SSE
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 4. Cache Eficiente de Arquivos Estáticos Locais
    location /static/ {
        alias /var/www/painel_cyber_protect/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

# ====================================================================
# SERVIDOR 3: CONSOLE ADMINISTRATIVO EXTERNO ISOLADO (HTTPS PORTA 443)
# ====================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.jmcyberprotect.tech;

    ssl_certificate /etc/letsencrypt/live/monitor.jmcyberprotect.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.jmcyberprotect.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Opcional: restringir acesso apenas ao IP corporativo ou VPN
    # allow 187.9.95.202; # IP WAN Corporativo
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
