# ====================================================================
# Configuração Nginx de Produção para o JM Cyber Protect
# Domínio: jmcyberprotect.tech
# Caminho na VPS: /etc/nginx/sites-available/jmcyberprotect.tech
# ====================================================================

# 1. Servidor HTTP (Porta 80) - Proxy Reverso e Validação SSL
server {
    listen 80;
    listen [::]:80;
    server_name monitor.jmcyberprotect.tech jmcyberprotect.tech www.jmcyberprotect.tech;

    # Encaminhamento para o painel FastAPI (Porta 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Cache de arquivos estáticos (logos, imagens, css)
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_cache_valid 200 30d;
        access_log off;
        expires 30d;
    }
}

# 2. (Opcional) Subdomínio para o Console Administrativo Externo (Porta 8001)
server {
    listen 80;
    server_name admin.jmcyberprotect.tech;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
