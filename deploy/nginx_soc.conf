# ====================================================================
# Configuração Nginx de Alta Blindagem para VPS (SOC War Room)
# Suporta HTTPS estrito (443), WebSocket (/ws/soc), Rate Limiting e Headers OWASP
# ====================================================================

# Zonas de Limitação de Taxa (Anti-DDoS e Brute-Force)
limit_req_zone $binary_remote_addr zone=soc_login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=soc_cmd_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=soc_general_limit:10m rate=60r/s;

# 1. Redirecionamento Estrito HTTP -> HTTPS (Porta 80)
server {
    listen 80;
    listen [::]:80;
    server_name monitor.jmcyberprotect.tech jmcyberprotect.tech www.jmcyberprotect.tech _;

    # Desafio ACME Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS Seguro (Porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.jmcyberprotect.tech jmcyberprotect.tech www.jmcyberprotect.tech;

    # Certificados SSL (Let's Encrypt / TLS 1.2 e 1.3)
    ssl_certificate /etc/letsencrypt/live/jmcyberprotect.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jmcyberprotect.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança (OWASP & HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 16M;

    # Rate limiting no endpoint de login
    location /api/auth/login {
        limit_req zone=soc_login_limit burst=5 nodelay;
        proxy_pass http://painel-cyber:8000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limiting em comandos de contenção destrutivos
    location ~* ^/api/soc/(devices/.*/isolate|unifi/clients/.*/block|rules) {
        limit_req zone=soc_cmd_limit burst=10 nodelay;
        proxy_pass http://painel-cyber:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para WebSocket do SOC em tempo real (/ws/soc)
    location /ws/soc {
        proxy_pass http://painel-cyber:8000/ws/soc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Aplicação Principal (Painel FastAPI)
    location / {
        limit_req zone=soc_general_limit burst=40 nodelay;
        proxy_pass http://painel-cyber:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Cache de estáticos
    location /static/ {
        proxy_pass http://painel-cyber:8000/static/;
        proxy_cache_valid 200 30d;
        access_log off;
        expires 30d;
    }
}
